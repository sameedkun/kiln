# Project-wide clippy configuration.
disallowed-methods = [
    # I-44: on some Windows machines std's POSIX-semantics rename fails inside the user profile
    # with os error 17. kiln-sys is the only place allowed to call it.
    { path = "std::fs::rename", reason = "use kiln_sys::rename_replace (or replace_file to keep ACLs); see I-44" },
]
