[workspace]
resolver = "3"
members = ["crates/kiln-core", "crates/kiln-ops", "crates/kiln-platform", "crates/kiln-cli", "crates/kiln-sys", "crates/kiln-state", "crates/kiln-helper", "crates/kiln-pki"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/sameedkun/kiln"
publish = false

[workspace.dependencies]
kiln-core = { path = "crates/kiln-core" }
kiln-ops = { path = "crates/kiln-ops" }
kiln-platform = { path = "crates/kiln-platform" }
kiln-sys = { path = "crates/kiln-sys" }
kiln-state = { path = "crates/kiln-state" }
kiln-helper = { path = "crates/kiln-helper" }
kiln-pki = { path = "crates/kiln-pki" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
tempfile = "3"
# Bundled SQLite: one known version on every platform, no system library needed.
rusqlite = { version = "0.40", features = ["bundled"] }
# Helper message authentication (ADR 0009); RustCrypto, MIT/Apache-2.0.
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4"
# Local CA (ADR 0010): rcgen with the ring backend (no cmake/nasm needed on Windows).
rcgen = { version = "0.14", features = ["x509-parser"] }
sha1 = "0.11"
time = "0.3"
x509-parser = "0.18"
# Test-only independent X.509 verifier (enforces name constraints).
rustls-webpki = { version = "0.103", features = ["ring"] }
rustls-pki-types = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
