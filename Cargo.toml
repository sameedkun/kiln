[workspace]
resolver = "3"
members = ["crates/kiln-core", "crates/kiln-ops", "crates/kiln-platform", "crates/kiln-cli", "crates/kiln-sys", "crates/kiln-state", "crates/kiln-helper", "crates/kiln-pki", "crates/kiln-web", "crates/kiln-fetch", "crates/kiln-php", "crates/kiln-supervisor", "crates/kiln-sites", "crates/kiln-runtime", "crates/kiln-doctor", "crates/kiln-coexist", "crates/kiln-daemon", "crates/kiln-node"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/sameedkun/kiln"
publish = false

[workspace.dependencies]
kiln-core = { path = "crates/kiln-core" }
kiln-ops = { path = "crates/kiln-ops" }
kiln-platform = { path = "crates/kiln-platform" }
kiln-sys = { path = "crates/kiln-sys" }
kiln-state = { path = "crates/kiln-state" }
kiln-helper = { path = "crates/kiln-helper" }
kiln-pki = { path = "crates/kiln-pki" }
kiln-web = { path = "crates/kiln-web" }
kiln-fetch = { path = "crates/kiln-fetch" }
kiln-php = { path = "crates/kiln-php" }
kiln-node = { path = "crates/kiln-node" }
kiln-supervisor = { path = "crates/kiln-supervisor" }
kiln-daemon = { path = "crates/kiln-daemon" }
kiln-sites = { path = "crates/kiln-sites" }
kiln-runtime = { path = "crates/kiln-runtime" }
kiln-doctor = { path = "crates/kiln-doctor" }
kiln-coexist = { path = "crates/kiln-coexist" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
tempfile = "3"
# Bundled SQLite: one known version on every platform, no system library needed.
rusqlite = { version = "0.40", features = ["bundled"] }
# Helper message authentication (ADR 0009); RustCrypto, MIT/Apache-2.0.
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4"
# Local CA (ADR 0010): rcgen with the ring backend (no cmake/nasm needed on Windows).
rcgen = { version = "0.14", features = ["x509-parser"] }
sha1 = "0.11"
time = "0.3"
x509-parser = "0.18"
# Test-only independent X.509 verifier (enforces name constraints).
rustls-webpki = { version = "0.103", features = ["ring"] }
rustls-pki-types = "1"
# TLS (ring backend): the downloader's crypto provider, and the test client for Caddy's HTTPS sites.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# HTTPS downloads (ADR 0013): rustls with ring, server certificates checked against the OS store.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
# Caddy release archives (ADR 0011). Pure-Rust deflate only; no bzip2/lzma/zstd C code.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Caddy release archives for Linux and macOS (.tar.gz): pure-Rust gzip through zlib-rs.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4", default-features = false }
# Linux: the Secret Service (ADR 0021) over D-Bus: a client only, driven by zbus::block_on.
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy"] }
futures-core = { version = "0.3", default-features = false }
# Project config (ADR 0027): `kiln.toml` parsed to a table, read field by field.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# `kiln import herd` (ADR 0027 §5): reading a user's herd.yml. Pure Rust.
yaml-rust2 = { version = "0.13", default-features = false }
# Node release signatures (ADR 0028 §2): the armored keys, and RSA / Ed25519 checks. Both are
# already in the tree through the TLS stack.
base64 = "0.23"
ring = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
