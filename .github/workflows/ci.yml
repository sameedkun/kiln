name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS (Phase 3) runs nightly and on demand only: its runner queue held pushes up for
  # many minutes, while Windows and Linux (Phase 1) are tested on every push.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per trigger, so a push never cancels the nightly macOS run.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt & policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - run: cargo fmt --all --check
      - name: unsafe stays in kiln-sys (ADR 0008)
        run: |
          status=0
          for manifest in crates/*/Cargo.toml; do
            [ "$manifest" = crates/kiln-sys/Cargo.toml ] && continue
            if ! awk '/^\[lints\]/{f=1;next} /^\[/{f=0} f && /^workspace *= *true/{ok=1} END{exit !ok}' "$manifest"; then
              echo "::error file=$manifest::must use '[lints] workspace = true' (unsafe_code is forbidden outside kiln-sys)"
              status=1
            fi
          done
          exit $status

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["windows-latest", "ubuntu-latest", "macos-latest"]' || '["windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
        env:
          PROPTEST_CASES: "512"
      # Against a real Caddy (ADR 0011): `kiln web install` downloads the pinned, hash-checked
      # release into the runner's Kiln folder, then the end-to-end test runs against it.
      - name: real Caddy test
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo run -p kiln-cli --bin kiln --locked -q -- web install
          if [ "$RUNNER_OS" = Windows ]; then
            caddy="$LOCALAPPDATA/Kiln/bin/kiln-caddy.exe"
          else
            caddy="$HOME/.local/share/kiln/bin/kiln-caddy"
          fi
          KILN_TEST_CADDY="$caddy" cargo test -p kiln-web --locked --test caddy -- --nocapture

  deny:
    name: licenses & advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
