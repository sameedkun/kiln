name: Scenario

# The Windows services scenario on a clean runner (ADR 0039 §3, P3-13): real downloads, real
# services, uninstall, and the machine compared before and after. Herd coexistence and the
# certificate dialog need a desktop session and are checked by hand in the Windows VM.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenario-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: services, uninstall --${{ matrix.uninstall }} (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    # Both endings of a run: the data kept in the home folder, or deleted with Kiln (P3-12).
    strategy:
      fail-fast: false
      matrix:
        uninstall: [keep-data, delete-data]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins --locked
      - name: scenario
        shell: powershell
        run: tests\ci\windows-services.ps1 -Kiln "$pwd\target\debug\kiln.exe" -Uninstall ${{ matrix.uninstall }}
      - name: keep the scenario's log and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-scenario-${{ matrix.uninstall }}
          path: ${{ runner.temp }}/kiln-ci
